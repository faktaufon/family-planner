<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8fafc"><title>Family Planner</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f6f8fb;color:#182235;margin:0}main{max-width:1150px;margin:auto;padding:20px}header,.toolbar,.members,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}h1{margin:0}button,input,select,textarea{font:inherit;border:1px solid #dce2e9;border-radius:10px;padding:10px;background:white}button{cursor:pointer}button.active{background:#172a45;color:white}.panel{background:white;border:1px solid #e4e8ee;border-radius:18px;padding:16px;margin-top:16px}.members{justify-content:flex-start}.member{display:flex;gap:6px;align-items:center}.dot{width:12px;height:12px;border-radius:50%;display:inline-block}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{background:#f7f9fc;border-radius:10px;padding:7px;min-height:135px;min-width:0}.day h3{font-size:13px;margin:0 0 9px}.event{color:white;border-radius:7px;padding:6px;margin:4px 0;font-size:12px;cursor:pointer;overflow-wrap:anywhere}.month .day{min-height:75px}.muted{color:#778296}dialog{border:0;border-radius:16px;box-shadow:0 20px 80px #0003;max-width:min(420px,90vw);width:100%}form{display:grid;gap:10px}label{display:grid;gap:5px;font-size:13px}dialog::backdrop{background:#172a4588}@media(max-width:650px){main{padding:10px}.grid{gap:2px}.day{padding:3px;min-height:100px}.day h3{font-size:10px}.event{font-size:10px;padding:3px}.panel{padding:9px}header h1{font-size:24px}}</style></head><body><main><header><div><h1>Family Planner ♡</h1><span class="muted">Familiens fælles kalender</span></div><button id="add">+ Ny aftale</button></header><section class="panel"><div id="members" class="members"></div></section><section class="panel"><div class="toolbar"><div class="actions"><button id="prev">‹</button><button id="today">I dag</button><button id="next">›</button><strong id="heading"></strong></div><div class="actions" id="views"></div></div><div id="calendar" style="margin-top:16px"></div></section><p class="muted" style="font-size:12px">Denne version gemmer aftaler lokalt på denne enhed. Fælles login og synkronisering kræver en online tjeneste.</p></main><dialog id="editor"><form id="eventForm"><h2 id="formTitle">Ny aftale</h2><label>Aktivitet<input name="title" required maxlength="100"></label><label>Dato<input name="date" type="date" required></label><div class="actions"><label>Start<input name="start" type="time" required value="12:00"></label><label>Slut<input name="end" type="time" value="13:00"></label></div><label>Deltagere<select name="person" multiple size="6"></select></label><small class="muted">Hold Ctrl/Cmd nede for at vælge flere deltagere.</small><label>Noter<textarea name="notes"></textarea></label><label><span>Gentag</span><select name="repeat"><option value="none">Ikke gentaget</option><option value="weekly">Hver uge</option></select></label><div class="actions"><button type="button" id="delete" style="color:#b42318">Slet</button><div class="actions"><button type="button" id="cancel">Annuller</button><button type="submit">Gem</button></div></div></form></dialog><script>
const people=[['Mor','#dc4545'],['Far','#347dd1'],['Mikas','#269451'],['Emias','#e68a27'],['Aliya','#e65c9b'],['Nira','#8d5bba']];let events=JSON.parse(localStorage.getItem('familyPlannerEvents')||'[]'),visible=new Set(people.map(p=>p[0])),view='Uge',cursor=new Date(),editId=null;const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,date=s=>new Date(s+'T12:00:00'),addDays=(d,n)=>{let a=new Date(d);a.setDate(a.getDate()+n);return a},monday=d=>addDays(d,-(d.getDay()+6)%7),fmt=(d,opts)=>d.toLocaleDateString('da-DK',opts),week=d=>{let a=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));a.setUTCDate(a.getUTCDate()+4-(a.getUTCDay()||7));return Math.ceil(((a-new Date(Date.UTC(a.getUTCFullYear(),0,1)))/86400000+1)/7)};function save(){localStorage.setItem('familyPlannerEvents',JSON.stringify(events))}function matches(e,d){return e.date===iso(d)||(e.repeat==='weekly'&&date(e.date)<=d&&date(e.date).getDay()===d.getDay())}function render(){ $('members').innerHTML='';people.forEach(([name,color])=>{let b=document.createElement('button');b.className='member';b.style.opacity=visible.has(name)?1:.4;b.innerHTML=`<span class="dot" style="background:${color}"></span>${name}`;b.onclick=()=>{visible.has(name)?visible.delete(name):visible.add(name);render()};$('members').append(b)});$('views').innerHTML='';['Dag','Uge','Måned','År'].forEach(v=>{let b=document.createElement('button');b.textContent=v;b.className=v===view?'active':'';b.onclick=()=>{view=v;render()};$('views').append(b)});let cal=$('calendar');cal.innerHTML='';let start,end;if(view==='Dag'){start=new Date(cursor);end=new Date(cursor);$('heading').textContent=fmt(cursor,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}if(view==='Uge'){start=monday(cursor);end=addDays(start,6);$('heading').textContent=`Uge ${week(start)} · ${fmt(start,{day:'numeric',month:'short'})} – ${fmt(end,{day:'numeric',month:'short',year:'numeric'})}`}if(view==='Måned'){start=new Date(cursor.getFullYear(),cursor.getMonth(),1);end=new Date(cursor.getFullYear(),cursor.getMonth()+1,0);$('heading').textContent=fmt(cursor,{month:'long',year:'numeric'})}if(view==='År'){$('heading').textContent=cursor.getFullYear();let grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px';for(let m=0;m<12;m++){let b=document.createElement('button');b.textContent=fmt(new Date(cursor.getFullYear(),m,1),{month:'long'});b.onclick=()=>{cursor=new Date(cursor.getFullYear(),m,1);view='Måned';render()};grid.append(b)}cal.append(grid);return}let grid=document.createElement('div');grid.className='grid '+(view==='Måned'?'month':'');if(view==='Måned'){['Man','Tir','Ons','Tor','Fre','Lør','Søn'].forEach(x=>{let a=document.createElement('div');a.textContent=x;a.className='muted';a.style.textAlign='center';grid.append(a)});for(let n=0;n<(start.getDay()+6)%7;n++)grid.append(document.createElement('div'))}for(let d=new Date(start);d<=end;d=addDays(d,1)){let day=document.createElement('div');day.className='day';let h=document.createElement('h3');h.textContent=view==='Måned'?d.getDate():fmt(d,{weekday:'short',day:'numeric'});day.append(h);let dayDate=iso(d);day.onclick=()=>openEditor(null,dayDate);events.filter(e=>matches(e,d)&&e.people.some(p=>visible.has(p))).sort((a,b)=>a.start.localeCompare(b.start)).forEach(e=>{let item=document.createElement('div');item.className='event';let p=e.people.find(p=>visible.has(p))||e.people[0];item.style.background=people.find(x=>x[0]===p)?.[1]||'#667085';item.textContent=`${e.start} ${e.title} · ${e.people.join(', ')}`;item.onclick=ev=>{ev.stopPropagation();openEditor(e)};day.append(item)});grid.append(day)}cal.append(grid)}function openEditor(e=null,day=iso(cursor)){editId=e?.id||null;let f=$('eventForm');f.reset();f.elements.title.value=e?.title||'';f.elements.date.value=e?.date||day;f.elements.start.value=e?.start||'12:00';f.elements.end.value=e?.end||'13:00';f.elements.notes.value=e?.notes||'';f.elements.repeat.value=e?.repeat||'none';Array.from(f.elements.person.options).forEach(o=>o.selected=(e?.people||['Mor']).includes(o.value));$('delete').hidden=!e;$('formTitle').textContent=e?'Rediger aftale':'Ny aftale';$('editor').showModal()}$('eventForm').elements.person.innerHTML=people.map(p=>`<option value="${p[0]}">${p[0]}</option>`).join('');$('eventForm').onsubmit=ev=>{ev.preventDefault();let f=ev.target,ps=Array.from(f.elements.person.selectedOptions).map(o=>o.value);if(!ps.length){alert('Vælg mindst én deltager');return}let e={id:editId||crypto.randomUUID(),title:f.elements.title.value.trim(),date:f.elements.date.value,start:f.elements.start.value,end:f.elements.end.value,notes:f.elements.notes.value,repeat:f.elements.repeat.value,people:ps};if(e.end&&e.end<e.start){alert('Sluttid skal være efter starttid');return}events=events.filter(x=>x.id!==e.id);events.push(e);save();$('editor').close();render()};$('add').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').close();$('delete').onclick=()=>{if(confirm('Slet denne aftale?')){events=events.filter(e=>e.id!==editId);save();$('editor').close();render()}};$('today').onclick=()=>{cursor=new Date();render()};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);function move(n){if(view==='Dag')cursor.setDate(cursor.getDate()+n);if(view==='Uge')cursor.setDate(cursor.getDate()+7*n);if(view==='Måned')cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);if(view==='År')cursor=new Date(cursor.getFullYear()+n,cursor.getMonth(),1);render()}render();
</script></body></html>
